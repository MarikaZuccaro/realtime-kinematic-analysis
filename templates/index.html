<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI-Physio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green:   #00e676;
            --red:     #ff4444;
            --amber:   #ffb300;
            --blue:    #5b9cf6;
            --bg:      #0b0d12;
            --glass:   rgba(11, 13, 20, 0.78);
            --surface: rgba(255,255,255,0.05);
            --border:  rgba(255,255,255,0.08);
            --text:    #eef0f6;
            --muted:   #48505f;
            --panel-h: 220px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* ─── VIDEO ─────────────────────────────────── */
        #stream-wrap {
            position: fixed;
            inset: 0;
            background: #000;
        }
        #stream {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }
        #stream-wrap::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 260px;
            background: linear-gradient(to top, rgba(11,13,18,.85) 0%, transparent 100%);
            pointer-events: none;
        }

        /* ─── TOP LEFT: brand ────────────────────────── */
        .hud-tl {
            position: fixed;
            top: 16px; left: 16px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px 8px 10px;
        }
        .live-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--muted);
            transition: background .4s, box-shadow .4s;
            flex-shrink: 0;
        }
        .live-dot.on  { background: var(--green); box-shadow: 0 0 10px var(--green); animation: blink 2.2s infinite; }
        .live-dot.err { background: var(--red); }
        @keyframes blink { 0%,100%{opacity:1} 55%{opacity:.25} }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .9rem;
            letter-spacing: -.01em;
            color: #fff;
        }
        .brand-name em { color: var(--green); font-style: normal; }

        .vista-tag {
            font-size: .6rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--blue);
            background: rgba(91,156,246,.12);
            border: 1px solid rgba(91,156,246,.28);
            border-radius: 6px;
            padding: 4px 10px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity .3s, transform .3s;
            width: fit-content;
        }
        .vista-tag.show { opacity: 1; transform: translateY(0); }

        /* ─── TOP RIGHT: rep ring + angoli ──────────── */
        .hud-tr {
            position: fixed;
            top: 16px; right: 16px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .rep-ring-wrap {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ring-svg { display: block; flex-shrink: 0; }
        .ring-bg   { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 5; }
        .ring-fill {
            fill: none;
            stroke: var(--green);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 163.4;
            stroke-dashoffset: 163.4;
            transform: rotate(-90deg);
            transform-origin: 32px 32px;
            transition: stroke-dashoffset .4s ease, stroke .3s;
        }
        .ring-fill.done { stroke: var(--amber); }
        .ring-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: none;
        }
        .ring-num {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            line-height: 1;
            color: #fff;
            transition: transform .15s;
        }
        .ring-num.bump { transform: scale(1.3); color: var(--green); }
        .ring-target { font-size: .55rem; color: var(--muted); letter-spacing: .06em; }
        .ring-pos { position: relative; width: 64px; height: 64px; flex-shrink: 0; }

        .rep-text-col { display: flex; flex-direction: column; gap: 1px; }
        .rep-main-label { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
        .rep-ex-name    { font-size: .72rem; color: #fff; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .angle-stack { display: flex; flex-direction: column; gap: 5px; }
        .acard {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            min-width: 148px;
            transition: border-color .3s, background .3s;
        }
        .acard.ok  { border-color: rgba(0,230,118,.35); background: rgba(0,230,118,.05); }
        .acard.bad { border-color: rgba(255,68,68,.45); background: rgba(255,68,68,.07); }
        .acard-label { font-size: .6rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); flex: 1; }
        .acard-val   { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: #fff; transition: color .3s; }
        .acard.ok  .acard-val { color: var(--green); }
        .acard.bad .acard-val { color: var(--red); }

        /* ─── AVVISO centro schermo ──────────────────── */
        #warn-overlay {
            position: fixed;
            bottom: calc(var(--panel-h) + 20px);
            left: 50%; transform: translateX(-50%);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,68,68,.14);
            border: 1px solid rgba(255,68,68,.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 22px;
            color: var(--red);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: .9rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            transition: opacity .25s, transform .25s;
        }
        #warn-overlay.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .warn-icon { font-size: 1rem; }

        /* ─── PANNELLO BOTTOM ────────────────────────── */
        #panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            padding: 0 16px 20px;
            transition: transform .38s cubic-bezier(.4,0,.2,1);
            height: var(--panel-h);
        }
        #panel.collapsed { transform: translateY(calc(100% - 46px)); }

        .panel-handle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 10px;
            cursor: pointer;
            user-select: none;
        }
        .handle-left  { display: flex; align-items: center; gap: 8px; }
        .handle-bar   { width: 32px; height: 3px; background: var(--border); border-radius: 2px; }
        .panel-label  { font-size: .65rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
        .chevron      { font-size: .75rem; color: var(--muted); transition: transform .35s; }
        #panel.collapsed .chevron { transform: rotate(180deg); }

        .ex-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .ex-grid { grid-template-columns: 1fr 1fr; }
        }

        .ex-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: .7rem;
            padding: 9px 8px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all .2s;
        }
        .ex-btn .ex-icon { font-size: 1.2rem; }
        .ex-btn .ex-name { line-height: 1.2; color: var(--text); }
        .ex-btn:active   { background: rgba(255,255,255,.09); }
        .ex-btn.active {
            background: rgba(91,156,246,.14);
            border-color: rgba(91,156,246,.5);
            color: #fff;
        }
        .ex-btn.active .ex-name { color: var(--blue); }

        .bottom-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .instruction-box {
            flex: 1;
            font-size: .65rem;
            line-height: 1.65;
            color: var(--muted);
            padding: 8px 12px;
            background: rgba(0,0,0,.25);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .side-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .arto-toggle {
            display: flex;
            background: rgba(0,0,0,.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .arto-toggle.hidden { opacity: .3; pointer-events: none; }
        .arto-btn {
            flex: 1;
            padding: 7px 10px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            cursor: pointer;
            transition: background .2s, color .2s;
            white-space: nowrap;
        }
        .arto-btn.active { background: rgba(91,156,246,.2); color: var(--blue); }

        .btn-reset {
            background: rgba(255,68,68,.08);
            border: 1px solid rgba(255,68,68,.28);
            color: var(--red);
            font-family: 'DM Mono', monospace;
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s;
        }
        .btn-reset:active { background: rgba(255,68,68,.2); }

        /* ─── HUD DI REWARD (Session Recap Modal) ──────── */
        #reward-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #reward-backdrop.show { opacity: 1; pointer-events: auto; }

        .reward-card {
            background: rgba(16, 21, 33, 0.88);
            border: 2px solid var(--green);
            box-shadow: 0 0 50px rgba(0, 230, 118, 0.25);
            border-radius: 20px;
            padding: 32px 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            transform: scale(0.85) translateY(15px);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #reward-backdrop.show .reward-card { transform: scale(1) translateY(0); }

        .reward-badge {
            font-size: 3.2rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: floatBadge 3s ease-in-out infinite;
        }
        @keyframes floatBadge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .reward-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 4px;
        }
        .reward-subtitle {
            font-size: .65rem;
            color: var(--green);
            text-transform: uppercase;
            letter-spacing: .15em;
            margin-bottom: 24px;
        }

        .recap-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 28px;
            text-align: left;
        }
        .recap-tile {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recap-label {
            font-size: .6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .recap-value { font-size: .75rem; color: #fff; font-weight: 500; }

        .btn-reward-close {
            background: linear-gradient(135deg, var(--green) 0%, #00b0ff 100%);
            color: #0b0d12;
            border: none;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            transition: transform 0.1s;
        }
                .reward-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-download {
            background: rgba(91, 156, 246, 0.15);
            color: var(--blue);
            border: 1px solid rgba(91, 156, 246, 0.4);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-download:hover { background: rgba(91, 156, 246, 0.25); }
        .btn-download:active { transform: scale(0.97); }
        .btn-reward-close:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div id="stream-wrap">
    <img id="stream" src="{{ url_for('video_feed') }}" onload="onLive()" onerror="onErr()" alt="">
</div>

<div id="warn-overlay"><span class="warn-icon">⚠</span><span id="warn-text"></span></div>

<div class="hud-tl">
    <div class="brand-pill">
        <div class="live-dot" id="live-dot"></div>
        <div class="brand-name">AI<em>·</em>Physio</div>
    </div>
    <div class="vista-tag" id="vista-tag">— Vista</div>
</div>

<div class="hud-tr">
    <div class="rep-ring-wrap">
        <div class="ring-pos">
            <svg class="ring-svg" width="64" height="64" viewBox="0 0 64 64">
                <circle class="ring-bg"   cx="32" cy="32" r="26"/>
                <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="26"/>
            </svg>
            <div class="ring-label">
                <div class="ring-num"  id="ring-num">0</div>
                <div class="ring-target" id="ring-target">/ 15</div>
            </div>
        </div>
        <div class="rep-text-col">
            <div class="rep-main-label">Ripetizioni</div>
            <div class="rep-ex-name" id="rep-ex-name">Squat</div>
        </div>
    </div>
    <div class="angle-stack" id="angle-stack"></div>
</div>

<div id="panel" class="collapsed">
    <div class="panel-handle" onclick="togglePanel()">
        <div class="handle-left">
            <div class="handle-bar"></div>
            <span class="panel-label">Protocollo Clinico</span>
        </div>
        <span class="chevron">▲</span>
    </div>

    <div class="ex-grid">
        {% for id, ex in esercizi.items() %}
        <button class="ex-btn {% if id == 'squat' %}active{% endif %}" id="btn-{{ id }}" onclick="cambiaEsercizio('{{ id }}')">
            <span class="ex-icon">{{ ex.icon }}</span>
            <span class="ex-name">{{ ex.nome }}</span>
        </button>
        {% endfor %}
    </div>

    <div class="bottom-row">
        <div class="instruction-box" id="istr-box">{{ esercizi.squat.istruzioni }}</div>
        <div class="side-col">
            <div class="arto-toggle" id="arto-toggle">
                <button class="arto-btn active" id="arto-sin" onclick="cambiaArto('sinistro')">◀ Sin</button>
                <button class="arto-btn"        id="arto-des" onclick="cambiaArto('destro')">Des ▶</button>
            </div>
            <button class="btn-reset" onclick="eseguiReset()">↺ Reset</button>
        </div>
    </div>
</div>

<div id="reward-backdrop">
    <div class="reward-card">
        <div class="reward-badge">🏆</div>
        <h2 class="reward-title">Ottimo Lavoro!</h2>
        <div class="reward-subtitle">Sessione Completata</div>
        
        <div class="recap-container">
            <div class="recap-tile">
                <span class="recap-label">Esercizio</span>
                <span class="recap-value" id="rec-ex-name">—</span>
            </div>
            <div class="recap-tile">
                <span class="recap-label">Arto Trattato</span>
                <span class="recap-value" id="rec-arto">—</span>
            </div>
            <div class="recap-tile">
                <span class="recap-label">Target Raggiunto</span>
                <span class="recap-value" id="rec-reps" style="color: var(--green); font-weight: bold;">—</span>
            </div>
            <div class="recap-tile">
                <span class="recap-label">Accuratezza Movimento</span>
                <span class="recap-value" id="rec-acc" style="color: var(--blue); font-weight: bold;">—</span>
            </div>
        </div>
        
        <div class="reward-buttons">
            <button class="btn-download" onclick="scaricaReferto()">📥 Scarica Referto</button>
            <button class="btn-reward-close" onclick="chiudiRewardModal()">Nuova Sessione</button>
        </div>
    </div>
</div>

<script>
// ── Stato locale ──────────────────────────────────────────
let panelOpen          = false;
let lastRep            = 0;
let repTarget          = 15;
let pollTimer          = null;
let lastAvviso         = "";
let hasTriggeredReward = false;
let erroriGlobali = {};
const CIRC             = 163.4; // 2π × 26

// ── Sintesi Vocale (Audio Feedback) ───────────────────────
function parla(testo) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // Stronca code pendenti per massima reattività
    const msg = new SpeechSynthesisUtterance(testo);
    msg.lang = 'it-IT';
    msg.rate = 1.1; // Cadenza dinamica e chiara
    window.speechSynthesis.speak(msg);
}

// ── Stream ────────────────────────────────────────────────
function onLive() {
    document.getElementById('live-dot').className = 'live-dot on';
    startPolling();
}
function onErr() {
    document.getElementById('live-dot').className = 'live-dot err';
    stopPolling();
    setTimeout(() => {
        document.getElementById('stream').src = '/video_feed?' + Date.now();
    }, 2500);
}

// ── Panel ─────────────────────────────────────────────────
function togglePanel() {
    panelOpen = !panelOpen;
    document.getElementById('panel').classList.toggle('collapsed', !panelOpen);
}

// ── Cambio esercizio ──────────────────────────────────────
function cambiaEsercizio(id) {
    document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + id).classList.add('active');

    fetch('/cambia_esercizio', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({esercizio: id})
    })
    .then(r => r.json())
    .then(d => {
        if (d.status !== 'ok') return;

        document.getElementById('istr-box').textContent    = d.istruzioni;
        document.getElementById('rep-ex-name').textContent = d.nome;

        const vt = document.getElementById('vista-tag');
        vt.textContent = 'Inquadratura: ' + d.vista;
        vt.classList.add('show');

        repTarget = d.rep_target;
        document.getElementById('ring-target').textContent = '/ ' + repTarget;

        const tog = document.getElementById('arto-toggle');
        tog.classList.toggle('hidden', !d.mono_arto);

        hasTriggeredReward = false;
        resetRingUI(0);
        document.getElementById('angle-stack').innerHTML = '';

        panelOpen = false;
        document.getElementById('panel').classList.add('collapsed');
    });
}

// ── Cambio arto ───────────────────────────────────────────
function cambiaArto(arto) {
    document.getElementById('arto-sin').classList.toggle('active', arto === 'sinistro');
    document.getElementById('arto-des').classList.toggle('active', arto === 'destro');

    fetch('/cambia_arto', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({arto})
    })
    .then(r => r.json())
    .then(d => {
        if (d.status === 'ok') {
            hasTriggeredReward = false;
            resetRingUI(0);
        }
    });
}

// ── Reset ─────────────────────────────────────────────────
function eseguiReset() {
    fetch('/reset').then(r => r.json()).then(() => {
        hasTriggeredReward = false;
        resetRingUI(0);
    });
}

function resetRingUI(val) {
    lastRep = val;
    updateRing(val);
    document.getElementById('ring-num').textContent = val;
}

// ── Anello progresso ──────────────────────────────────────
function updateRing(rip) {
    const fill   = document.getElementById('ring-fill');
    const numEl  = document.getElementById('ring-num');
    const ratio  = Math.min(rip / repTarget, 1);
    const offset = CIRC * (1 - ratio);
    fill.style.strokeDashoffset = offset;
    fill.classList.toggle('done', rip >= repTarget);
    numEl.textContent = rip;
}

function bumpNum() {
    const el = document.getElementById('ring-num');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 200);
}

// ── Gestione Finestra Reward ──────────────────────────────
function chiudiRewardModal() {
    document.getElementById('reward-backdrop').classList.remove('show');
    eseguiReset(); // Azzera in background pronto per una nuova serie pulita
}

// ── Polling /data ─────────────────────────────────────────
function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollData, 220);
}
function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
}

async function pollData() {
    try {
        const r = await fetch('/data');
        if (!r.ok) return;
        const d = await r.json();

        // Conteggio Ripetizioni e Vocale Numero
        if (d.ripetizioni !== lastRep) {
            if (d.ripetizioni > lastRep) {
                bumpNum();
                // Parla solo se non siamo arrivati alla fine, per non sovrapporsi al reward vocale
                if (d.ripetizioni < repTarget) {
                    parla(d.ripetizioni.toString());
                }
            }
            lastRep = d.ripetizioni;
            updateRing(d.ripetizioni);
        }

        // FASE DI REWARD CRISTALLINA
        if (d.ripetizioni >= repTarget && !hasTriggeredReward && repTarget > 0) {
            hasTriggeredReward = true;
            erroriGlobali = d.errori_sessione || {};
            
            parla("Esercizio completato correttamente! Ottimo lavoro.");
            
            document.getElementById('rec-ex-name').textContent = document.getElementById('rep-ex-name').textContent;
            document.getElementById('rec-reps').textContent = `${d.ripetizioni} / ${repTarget}`;
            
            const isSinistro = document.getElementById('arto-sin').classList.contains('active');
            document.getElementById('rec-arto').textContent = isSinistro ? "Sinistro" : "Destro";
            
            // Calcolo Matematico dell'Accuratezza (es. toglie 3% per ogni errore commesso)
            let totErrori = Object.values(erroriGlobali).reduce((a, b) => a + b, 0);
            let accuratezza = Math.max(0, 100 - (totErrori * 3));
            
            let colorAcc = accuratezza > 85 ? 'var(--green)' : accuratezza > 60 ? 'var(--amber)' : 'var(--red)';
            let elAcc = document.getElementById('rec-acc');
            elAcc.textContent = accuratezza + "%";
            elAcc.style.color = colorAcc;
            
            document.getElementById('reward-backdrop').classList.add('show');
        }
        // Gestione Avvisi Posturali
        const wo = document.getElementById('warn-overlay');
        const wt = document.getElementById('warn-text');
        if (d.avviso) {
            wt.textContent = d.avviso;
            wo.classList.add('show');
            if (d.avviso !== lastAvviso && !hasTriggeredReward) {
                parla(d.avviso);
                lastAvviso = d.avviso;
            }
        } else {
            wo.classList.remove('show');
            lastAvviso = "";
        }

        // Aggiornamento Box Angoli Laterali
        aggiornaAngoli(d);

    } catch(e) {}
}

const ANGLE_MAP = [
    ['angolo_ginocchio', 'Ginocchio', 'ok_ginocchio'],
    ['angolo_anca',      'Anca',      'ok_anca'],
    ['angolo_caviglia',  'Caviglia',  'ok_caviglia'],
    ['angolo_spalla',    'Spalla',    'ok_spalla'],
    ['angolo_gomito',    'Gomito',    'ok_gomito'],
];

function aggiornaAngoli(d) {
    const stack = document.getElementById('angle-stack');
    const attivi = ANGLE_MAP.filter(([campo]) => d[campo] != null);

    if (attivi.length === 0) { stack.innerHTML = ''; return; }

    attivi.forEach(([campo, label, okCampo]) => {
        let card = document.getElementById('acard-' + campo);
        if (!card) {
            card = document.createElement('div');
            card.id = 'acard-' + campo;
            card.className = 'acard';
            card.innerHTML =
                `<span class="acard-label">${label}</span>` +
                `<span class="acard-val" id="av-${campo}">—</span>`;
            stack.appendChild(card);
        }
        document.getElementById('av-' + campo).textContent = Math.round(d[campo]) + '°';
        const ok = d[okCampo];
        card.className = 'acard' + (ok === false ? ' bad' : ok === true ? ' ok' : '');
    });

    stack.querySelectorAll('.acard').forEach(c => {
        if (d[c.id.replace('acard-', '')] == null) c.remove();
    });
}

// ── Tasti rapidi ──────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') eseguiReset();
    if (e.key === ' ') { e.preventDefault(); togglePanel(); }
});

// ── Generazione Referto Medico CSV ───────────────────────
function scaricaReferto() {
    let exName = document.getElementById('rec-ex-name').textContent;
    let arto = document.getElementById('rec-arto').textContent;
    let acc = document.getElementById('rec-acc').textContent;
    let dataOggi = new Date().toLocaleString('it-IT');
    
    // Costruzione stringa CSV
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "=== REFERTO CLINICO AI-PHYSIO ===\n\n";
    csvContent += `Data e Ora:,${dataOggi}\n`;
    csvContent += `Esercizio:,${exName}\n`;
    csvContent += `Arto Trattato:,${arto}\n`;
    csvContent += `Target Completato:,${repTarget} Ripetizioni\n`;
    csvContent += `Accuratezza Globale:,${acc}\n\n`;
    
    csvContent += "--- DETTAGLIO COMPENSAZIONI (ERRORI) ---\n";
    let totErrori = Object.values(erroriGlobali).reduce((a, b) => a + b, 0);
    
    if (totErrori === 0) {
        csvContent += "Nessun errore rilevato. Esecuzione perfetta.\n";
    } else {
        for (const [errore, conteggio] of Object.entries(erroriGlobali)) {
            // Rimuoviamo eventuali virgole o prefissi dal testo dell'errore per pulire il CSV
            let errorePulito = errore.replace("ERRORE: ", "").replace("AVVISO: ", "").replace("PERICOLO: ", "");
            csvContent += `"${errorePulito}",${conteggio} volte\n`;
        }
    }

    // Trigger del Download
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    let nomeFile = `AI-Physio_Referto_${exName.replace(/\s+/g, '_')}_${new Date().getTime()}.csv`;
    link.setAttribute("download", nomeFile);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
